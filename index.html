<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Festa - Restaurant Ordering System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-600">
                🍴 Food Festa
            </h1>
            <button onclick="openCart()" class="relative bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-orange-600">
                🛒 Cart
                <span id="cartCount"class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">
                    0
                </span>
            </button>
        </div>
    </nav>
    <!-- Hero Section -->
    <section class="bg-orange-500 text-white py-16">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-4xl md:text-5xl font-bold mb-4">
                Delicious Food, Delivered Fast
            </h2>
            <p class="text-lg mb-8">
                Order your favourite food from Food Festa
            </p>
            <!-- Search -->
            <div class="max-w-xl mx-auto">
                <input
                    type="text" id="searchInput" placeholder="Search food..." oninput="searchFood()" class="w-full px-5 py-3 rounded-lg text-gray-800 outline-none">
            </div>
        </div>
    </section>
    <!-- Categories -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold mb-5">
            Food Categories
        </h2>
        <div class="flex flex-wrap gap-3">
            <button onclick="filterCategory('All')" class="category-btn bg-orange-500 text-white px-5 py-2 rounded-lg">
                All
            </button>
            <button onclick="filterCategory('Pizza')" class="category-btn bg-white px-5 py-2 rounded-lg shadow">
                Pizza
            </button>
            <button onclick="filterCategory('Burger')" class="category-btn bg-white px-5 py-2 rounded-lg shadow">
                Burger
            </button>
            <button onclick="filterCategory('Biryani')" class="category-btn bg-white px-5 py-2 rounded-lg shadow">
                Biryani
            </button>
            <button onclick="filterCategory('Dessert')" class="category-btn bg-white px-5 py-2 rounded-lg shadow">
                Dessert
            </button>
            <button onclick="filterCategory('Drinks')" class="category-btn bg-white px-5 py-2 rounded-lg shadow">
                Drinks
            </button>
        </div>
    </section>
    <!-- Menu -->
    <section class="max-w-7xl mx-auto px-4 pb-12">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">
                Our Menu
            </h2>
            <p id="foodCount" class="text-gray-500"></p>
        </div>
        <div id="foodContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>
    </section>
    <!-- Cart Overlay -->
    <div id="cartOverlay" onclick="closeCart()" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
    </div>
    <!-- Cart Sidebar -->
    <div id="cartSidebar"class="fixed top-0 right-0 w-full sm:w-96 h-full bg-white z-[60] shadow-xl transform translate-x-full transition-transform duration-300">
        <div class="flex justify-between items-center p-5 border-b">
            <h2 class="text-2xl font-bold">
                Your Cart
            </h2>
            <button onclick="closeCart()" class="text-2xl text-gray-500 hover:text-red-500">
                ✕
            </button>
        </div>
        <!-- Cart Items -->
        <div id="cartItems" class="p-5 h-[60%] overflow-y-auto">
        </div>
        <!-- Cart Summary -->
        <div class="border-t p-5">
            <div class="flex justify-between mb-2">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>
            <div class="flex justify-between mb-2">
                <span>Tax (5%)</span>
                <span id="tax">₹0</span>
            </div>
            <div class="flex justify-between text-xl font-bold mb-4">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>
            <button onclick="placeOrder()"class="w-full bg-orange-500 text-white py-3 rounded-lg hover:bg-orange-600">
                Place Order
            </button>
            <button onclick="clearCart()" class="w-full mt-2 border border-red-500 text-red-500 py-3 rounded-lg hover:bg-red-50">
                Clear Cart
            </button>
        </div>
    </div>
    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 hidden bg-green-500 text-white px-5 py-3 rounded-lg shadow-lg z-[70]">
        Item added to cart!
    </div>
    <script src="script.js"></script>
</body>
</html>
